name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Build all platforms
        run: make UPX=upx-ucl build-all

      - name: Generate checksums
        run: cd build && sha256sum csghub-airgap-linux-amd64 csghub-airgap-linux-arm64 csghub-airgap-darwin-amd64 csghub-airgap-darwin-arm64 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/csghub-airgap-linux-amd64
            build/csghub-airgap-linux-arm64
            build/csghub-airgap-darwin-amd64
            build/csghub-airgap-darwin-arm64
            build/checksums.txt
