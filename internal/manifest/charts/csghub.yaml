weight: 7
depends_on: ["longhorn"]

name: csghub
enabled: true

repo_name: csghub
repo_url: https://charts.opencsg.com/csghub/

chart_name: csghub
chart_version: ""

values:
  global:
    edition: ee
    image:
      registry: opencsg-registry.cn-beijing.cr.aliyuncs.com
    imageRegistry: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq
    gateway:
      external:
        domain: csghub.example.com

  server:
    gitlabShell:
      sshPort: "2222"

  runner:
    registry:
      repository: csghub
    volcano:
      basic:
        image_pull_policy: IfNotPresent
    lws:
      image:
        manager:
          repository: opencsghq/lws
    argo:
      images:
        pullPolicy: IfNotPresent
      controller:
        image:
          registry: quay.io
      executor:
        image:
          registry: quay.io
      server:
        image:
          registry: quay.io

# Images that the csghub chart does not render but the bundle still needs
# at deploy time. Keep in sync with chart's argo image versions below.
extra_images:
  - "quay.io/argoproj/argoexec:v3.7.11"